version: '3.8'
services:

  # 1. Definiamo il servizio BACKEND
  backend:
    build:
      context: ./backend
    ports:
      - "8003:8003"
    depends_on:
      - mariadb
      - ollama
      - neo4j  # <-- AGGIUNTO: Il backend ora aspetta anche Neo4j
    environment:
      - DB_HOST=mariadb
      - DB_USER=minerva_user       
      - DB_PASSWORD=minerva_pass 
      - DB_NAME=minerva_db
      - OLLAMA_HOST=http://ollama:11434
      # <-- AGGIUNTO: Credenziali e URI per Neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=minerva_graph_pass
    volumes:
      - ./gs_data:/app/gs_data
      - ./domains.json:/app/domains.json
      - ./backend/src/parsers/risultati:/app/src/parsers/risultati

  # 2. Definiamo il servizio FRONTEND
  frontend:
    build:
      context: ./frontend
    ports:
      - "8004:8004"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8003

  # 3. Definiamo il database MARIADB
  mariadb:
    image: mariadb:11.7.2-ubi9     
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: minerva_db
      MYSQL_USER: minerva_user     
      MYSQL_PASSWORD: minerva_pass 
    volumes:
      - mariadb_volume:/var/lib/mysql
      - ./init_db:/docker-entrypoint-initdb.d  
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Definiamo il servizio OLLAMA
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ./ollama_data:/root/.ollama 
      - ./entrypoint.sh:/entrypoint.sh
    container_name: ollama
    pull_policy: always
    tty: true
    restart: always
    entrypoint: ["/usr/bin/bash", "/entrypoint.sh"]

  # 5. Definiamo il servizio NEO4J
  neo4j:
    image: neo4j:5  # Usiamo la versione 5, stabile e recente
    ports:
      - "7474:7474" # Porta per l'interfaccia Web (Neo4j Browser)
      - "7687:7687" # Porta per il protocollo Bolt (connessione da Python)
    environment:
      # Impostiamo utente (neo4j) e password (minerva_graph_pass)
      - NEO4J_AUTH=neo4j/minerva_graph_pass
    volumes:
      - neo4j_volume:/data # Volume persistente per salvare il grafo

# DICHIARAZIONE DEI VOLUMI NOMINATI
volumes:
  mariadb_volume:
  neo4j_volume:  # <-- AGGIUNTO: Volume per Neo4j